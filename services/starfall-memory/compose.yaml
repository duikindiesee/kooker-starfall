name: starfall-memory
services:
  memory:
    build: .
    image: starfall-memory:0.1.0
    ports:
      - "127.0.0.1:17864:17864"
    volumes:
      - starfall_memory_v1:/data
    secrets:
      - starfall_memory_config
    networks:
      - memory_only
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
volumes:
  starfall_memory_v1:
networks:
  memory_only:
    internal: true
secrets:
  starfall_memory_config:
    file: .local-memory/config.json
