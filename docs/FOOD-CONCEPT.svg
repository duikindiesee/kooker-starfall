<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102d42"/><stop offset="1" stop-color="#496577"/></linearGradient>
<g id="bush"><path d="M0 0L-3-64M-2-29L-35-64M-2-38L27-79" fill="none" stroke="#b89885" stroke-width="9"/><g fill="#245962" stroke="#55828a" stroke-width="2"><ellipse cx="-30" cy="-63" rx="33" ry="16"/><ellipse cx="17" cy="-76" rx="34" ry="16"/><ellipse cx="2" cy="-47" rx="37" ry="17"/></g></g>
<g id="berry"><circle r="10" fill="#ae275c" stroke="#ed839f" stroke-width="2"/><path d="M-4-9L0-14L4-9" fill="#b5c5a2"/></g>
<g id="person"><circle cy="-64" r="10" fill="#dab797"/><path d="M-10-49L-16-15L15-15L10-49Z" fill="#dda850"/><path d="M-7-15L-10 0M7-15L10 0" stroke="#293b49" stroke-width="7"/></g>
</defs>
<rect width="1280" height="620" fill="#0c202d"/>
<text x="32" y="42" fill="#f2cda1" font-family="Segoe UI,sans-serif" font-size="15" letter-spacing="3">STARFALL / EDEN STUDY</text>
<text x="32" y="84" fill="#f5ece3" font-family="Segoe UI,sans-serif" font-size="32">A small fruit. A reason to return.</text>
<text x="32" y="116" fill="#b8ccd3" font-family="Segoe UI,sans-serif" font-size="16">CONCEPT STORYBOARD — illustrated design intent, not a gameplay screenshot</text>
<g font-family="Segoe UI,sans-serif">
<g transform="translate(32 144)"><rect width="230" height="340" rx="12" fill="url(#sky)"/><path d="M0 170L60 100L110 175L160 138L230 170V340H0" fill="#975c48"/><path d="M0 245Q100 200 230 240V340H0" fill="#c38965"/><use href="#bush" x="90" y="262"/><use href="#berry" x="65" y="199"/><use href="#berry" x="111" y="215"/><use href="#person" x="170" y="276"/><text x="16" y="28" fill="white" font-size="18">01 / DISCOVERY</text><rect x="143" y="154" width="33" height="31" fill="#eee0ba"/><text x="149" y="176" fill="#294652" font-size="22">?</text><text x="15" y="306" fill="#162d38" font-size="15">Unknown until a safe lesson.</text></g>
<g transform="translate(278 144)"><rect width="230" height="340" rx="12" fill="url(#sky)"/><path d="M0 180L65 125L120 185L200 148L230 170V340H0" fill="#975c48"/><path d="M0 245Q100 200 230 240V340H0" fill="#c38965"/><use href="#bush" x="90" y="262"/><use href="#berry" x="68" y="203"/><circle cx="110" cy="215" r="5" fill="#856fa4"/><use href="#person" x="168" y="276"/><use href="#berry" x="150" y="234"/><text x="16" y="28" fill="white" font-size="18">02 / ONE BERRY</text><text x="15" y="306" fill="#162d38" font-size="15">Take fruit. Remember its gift.</text></g>
<g transform="translate(524 144)"><rect width="230" height="340" rx="12" fill="url(#sky)"/><path d="M0 180L65 125L120 185L200 148L230 170V340H0" fill="#975c48"/><path d="M0 245Q100 200 230 240V340H0" fill="#c38965"/><use href="#bush" x="90" y="262"/><use href="#berry" x="67" y="251"/><path d="M70 215Q60 230 66 240" stroke="#f5d7a7" fill="none" stroke-dasharray="3 4"/><ellipse cx="103" cy="270" rx="5" ry="3" fill="#ecd3a3"/><ellipse cx="121" cy="271" rx="4" ry="3" fill="#ecd3a3"/><text x="16" y="28" fill="white" font-size="18">03 / FALLEN SEEDS</text><text x="15" y="306" fill="#162d38" font-size="15">Most fade back into the soil.</text></g>
<g transform="translate(770 144)"><rect width="230" height="340" rx="12" fill="url(#sky)"/><path d="M0 180L65 125L120 185L200 148L230 170V340H0" fill="#975c48"/><path d="M0 245Q100 200 230 240V340H0" fill="#c38965"/><path d="M0 267Q55 240 116 258T230 246" fill="none" stroke="#5caeb6" stroke-width="17"/><path d="M119 251L119 215" stroke="#afc7a0" stroke-width="4"/><ellipse cx="107" cy="219" rx="13" ry="6" fill="#4f9590" transform="rotate(25 107 219)"/><ellipse cx="131" cy="211" rx="13" ry="6" fill="#4f9590" transform="rotate(-25 131 211)"/><text x="16" y="28" fill="white" font-size="18">04 / A RARE BEGINNING</text><text x="15" y="306" fill="#162d38" font-size="15">Moisture, space and a chance.</text></g>
<g transform="translate(1016 144)"><rect width="230" height="340" rx="12" fill="url(#sky)"/><path d="M0 180L65 125L120 185L200 148L230 170V340H0" fill="#975c48"/><path d="M0 245Q100 200 230 240V340H0" fill="#c38965"/><use href="#bush" transform="translate(83 265) scale(.65)"/><circle cx="83" cy="232" r="6" fill="#866da3"/><use href="#person" x="171" y="276"/><path d="M151 238L127 250" stroke="#8dc9d0" stroke-width="3" stroke-dasharray="3 4"/><text x="16" y="28" fill="white" font-size="18">05 / RETURN &amp; TEND</text><text x="15" y="306" fill="#162d38" font-size="15">A memory becomes care.</text></g>
<text x="32" y="529" fill="#ebceac" font-size="19">Two mature bushes. Four living plants at most. Nothing grows without time and a place to live.</text>
<text x="32" y="565" fill="#b8ccd3" font-size="16">Purple-red ripe fruit • muted violet buds • blue-green leaves • warm canyon soil • pale visible seeds</text>
<text x="32" y="595" fill="#b8ccd3" font-size="14">Concept only. The separate player uses simplified geometry; screenshots and measured acceptance are delivered separately.</text>
</g></svg>
